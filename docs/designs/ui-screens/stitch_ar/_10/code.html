<script>
        // Self-correction for active state based on instructions:
        // Since it's the "Home Screen", "村落" is the best fit for active tab.
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('nav > a');
            if(tabs.length > 0) {
                // Make the first tab (村落) active
                const activeTab = tabs[0];
                activeTab.className = "flex flex-col items-center justify-center text-secondary dark:text-secondary-container bg-secondary-fixed-dim/20 rounded-full p-2 hover:opacity-80 scale-90 duration-150 transition-all mb-2";
                activeTab.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
            }
        });
