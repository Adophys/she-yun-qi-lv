<style>
        /* Custom styles for tactile Guochao buttons */
        .btn-guochao-primary {
            position: relative;
            overflow: hidden;
            border-bottom: 4px solid rgba(0, 0, 0, 0.15);
            transition: all 0.15s ease;
        }
        .btn-guochao-primary:active {
            border-bottom-width: 0px;
            transform: translateY(4px);
        }
        .btn-guochao-primary::after {
            content: '';

            inset: 0;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.05) 2px, rgba(255,255,255,0.05) 4px);
            opacity: 0.3;
            pointer-events: none;

<body class="bg-surface text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">

</div>
<!-- Bottom Section: Actions -->
<div class="z-10 w-full max-w-sm flex flex-col gap-stack-sm w-full px-4 mb-4">
<!-- Primary Action: WeChat Login -->
<button class="btn-guochao-primary w-full bg-jade-green text-surface-container-lowest font-label-md text-label-md py-4 rounded-xl flex items-center justify-center gap-2 shadow-[0px_8px_16px_rgba(42,157,143,0.2)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">chat</span>
                微信一键登录
            </button>
<!-- Secondary Action: Mobile Number Login -->
<button class="w-full bg-surface-container text-primary font-label-md text-label-md py-4 rounded-xl flex items-center justify-center gap-2 border-[0.5px] border-outline-variant/30 hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">phone_iphone</span>
                手机号登录/注册
            </button>
<!-- Terms & Privacy Policy Checkbox -->
<div class="mt-stack-md flex items-start gap-3 px-2">
<div class="flex items-center h-5">
<input class="custom-checkbox w-4 h-4 rounded-sm border-outline text-primary focus:ring-primary focus:ring-offset-surface bg-transparent transition-colors cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="font-label-sm text-label-sm text-on-surface-variant leading-relaxed cursor-pointer" for="terms">
                    我已阅读并同意
                    <a class="text-primary hover:underline underline-offset-2 decoration-primary/50 transition-all" href="#">《服务协议》</a>
                    与
                    <a class="text-primary hover:underline underline-offset-2 decoration-primary/50 transition-all" href="#">《隐私政策》</a>
                    ，未注册绑定的手机号验证后将自动创建账号。
                </label>
</div>

</main>
<script>
        // Simple validation to ensure terms are checked before primary action
        document.addEventListener('DOMContentLoaded', () => {
            const wechatBtn = document.querySelector('.btn-guochao-primary');
            const termsCheckbox = document.getElementById('terms');
            
            wechatBtn.addEventListener('click', (e) => {
                if (!termsCheckbox.checked) {
                    e.preventDefault();
                    // Simple visual feedback if not checked
                    termsCheckbox.parentElement.classList.add('animate-pulse');
                    termsCheckbox.classList.add('border-error');
                    setTimeout(() => {
                        termsCheckbox.parentElement.classList.remove('animate-pulse');
                        termsCheckbox.classList.remove('border-error');
                    }, 1000);
                } else {
                    // Proceed with login logic
                    console.log('Proceeding to WeChat login...');
                }
            });
        });
    </script>
