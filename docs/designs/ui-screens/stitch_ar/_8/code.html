<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>设置 - 畲韵奇旅</title>

                        "surface-container-highest": "#e4e2de",

                    "fontFamily": {
                        "body-md": ["Plus Jakarta Sans"],

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        .card-border {
            border: 0.5px solid rgba(53, 74, 129, 0.1);
        }
        .guochao-btn {
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 0 0 theme('colors.primary-fixed-dim');
        }
        .guochao-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.05) 10px, rgba(255,255,255,0.05) 20px);
            pointer-events: none;
        }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">
<!-- Header (Transactional Context: Minimal Navigation, Back Action) -->
<header class="bg-surface dark:bg-surface-dim flex justify-between items-center w-full px-margin-mobile h-16 fixed top-0 z-50 flat no shadows">
<div class="flex items-center">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">arrow_back</span>
</button>
</div>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-secondary dark:text-secondary-fixed">设置</h1>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-stack-lg px-margin-mobile flex flex-col gap-stack-lg max-w-2xl mx-auto w-full">
<!-- Account Security Section -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-label-md text-label-md text-outline px-2">账号与安全</h2>
<div class="bg-surface-container-lowest rounded-xl card-border overflow-hidden">
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors">
<span class="font-body-md text-body-md text-on-surface">修改密码</span>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
<div class="h-[1px] bg-outline-variant/30 mx-4 border-dashed border-b border-outline-variant/50"></div>
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors">
<span class="font-body-md text-body-md text-on-surface">绑定的手机号</span>
<div class="flex items-center gap-2">
<span class="font-body-md text-body-md text-outline">138****8888</span>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</div>
</button>
<div class="h-[1px] bg-outline-variant/30 mx-4 border-dashed border-b border-outline-variant/50"></div>
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors">
<span class="font-body-md text-body-md text-on-surface">注销账号</span>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</div>
</section>
<!-- Game Settings Section -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-label-md text-label-md text-outline px-2">游戏设置</h2>
<div class="bg-surface-container-lowest rounded-xl card-border overflow-hidden">
<div class="flex items-center justify-between p-4">
<span class="font-body-md text-body-md text-on-surface">声音效果</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-jade-green"></div>
</label>
</div>
<div class="h-[1px] bg-outline-variant/30 mx-4 border-dashed border-b border-outline-variant/50"></div>
<div class="flex items-center justify-between p-4">
<span class="font-body-md text-body-md text-on-surface">消息通知</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-jade-green"></div>
</label>
</div>
</div>
</section>
<!-- General Section -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-label-md text-label-md text-outline px-2">通用</h2>
<div class="bg-surface-container-lowest rounded-xl card-border overflow-hidden">
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors">
<span class="font-body-md text-body-md text-on-surface">清理缓存</span>
<span class="font-body-md text-body-md text-outline">128 MB</span>
</button>
<div class="h-[1px] bg-outline-variant/30 mx-4 border-dashed border-b border-outline-variant/50"></div>
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors">
<span class="font-body-md text-body-md text-on-surface">关于我们</span>
<span class="material-symbols-outlined text-outline-variant">chevron_right</span>
</button>
</div>
</section>
<!-- Logout Action -->
<div class="mt-8">
<button class="w-full py-4 rounded-xl bg-surface-container-lowest border border-error/20 text-error font-label-md text-label-md hover:bg-error-container/10 transition-colors shadow-sm">
                退出登录
            </button>
</div>
</main>
<!-- Navigation Shell suppressed because this is a Settings (Transactional/Task) page with a 'Back' action. -->
</body></html>
