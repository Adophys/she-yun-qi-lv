<!-- Interactive JS for simulated drag and particles -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const pieces = document.querySelectorAll('.puzzle-piece');
            
            pieces.forEach(piece => {
                piece.addEventListener('touchstart', () => {
                    piece.style.transform = 'scale(1.1) rotate(0deg)';
                    piece.style.zIndex = '50';
                });
                
                piece.addEventListener('touchend', (e) => {
                    piece.style.transform = '';
                    piece.style.zIndex = '';
                    // Simulate snapping and particle effect
                    createParticles(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                });

                // Mouse fallback for testing
                piece.addEventListener('mousedown', () => {
                    piece.style.transform = 'scale(1.1) rotate(0deg)';
                    piece.style.zIndex = '50';
                });
                
                piece.addEventListener('mouseup', (e) => {
                    piece.style.transform = '';
                    piece.style.zIndex = '';
                    createParticles(e.clientX, e.clientY);
                });
            });

            // Simple Particle System
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            let particles = [];

            function createParticles(x, y) {
                for (let i = 0; i < 20; i++) {
                    particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        life: 1,
                        color: Math.random() > 0.5 ? '#b7102a' : '#C0C0C0' // secondary or silver
                    });
                }
                animate();
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                
                for (let i = 0; i < particles.length; i++) {
                    let p = particles[i];
                    if (p.life > 0) {
                        active = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.2; // gravity
                        p.life -= 0.02;
                        
                        ctx.globalAlpha = Math.max(0, p.life);
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                
                if (active) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles = [];
                }
            }
            
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        });
    </script>
