<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('simulate-scan-btn');
            const phone = document.getElementById('smartphone-mockup');
            const glow = document.getElementById('success-glow');
            
            btn.addEventListener('click', () => {
                // Animate phone down to touch card
                phone.style.transform = 'translate(-50%, -50%) rotate(0deg) scale(1)';
                phone.style.boxShadow = '0px 8px 16px rgba(0,0,0,0.2)';
                
                // Hide button during simulation
                btn.style.opacity = '0';
                btn.style.pointerEvents = 'none';

                setTimeout(() => {
                    // Trigger success glow
                    glow.style.opacity = '0.8';
                    glow.classList.add('pulse-ring');
                    
                    // Optional: Change phone screen state
                    const phoneScreenText = phone.querySelector('span.text-label-md');
                    const phoneScreenIcon = phone.querySelector('span.material-symbols-outlined');
                    if(phoneScreenText) phoneScreenText.textContent = "Unlocked!";
                    if(phoneScreenIcon) {
                        phoneScreenIcon.textContent = "check_circle";
                        phoneScreenIcon.classList.remove('animate-pulse');
                        phoneScreenIcon.classList.add('text-jade-green');
                    }

                    setTimeout(() => {
                        // Reset after showing success
                        glow.style.opacity = '0';
                        glow.classList.remove('pulse-ring');
                        phone.style.transform = 'translate(-10%, -60%) rotate(10deg) scale(1.1)';
                        phone.style.boxShadow = '';
                        btn.style.opacity = '1';
                        btn.style.pointerEvents = 'auto';
                        
                        if(phoneScreenText) phoneScreenText.textContent = "请靠近感应区域";
                        if(phoneScreenIcon) {
                            phoneScreenIcon.textContent = "contactless";
                            phoneScreenIcon.classList.add('animate-pulse');
                            phoneScreenIcon.classList.remove('text-jade-green');
                        }
                    }, 2500);
                }, 800);
            });
        });
    </script>
