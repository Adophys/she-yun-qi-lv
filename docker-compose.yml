services:
  postgres:
    image: postgres:16-alpine
    container_name: syql-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sheyunqilv}
      POSTGRES_USER: ${POSTGRES_USER:-sheyunqilv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sheyunqilv}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sheyunqilv} -d ${POSTGRES_DB:-sheyunqilv}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
